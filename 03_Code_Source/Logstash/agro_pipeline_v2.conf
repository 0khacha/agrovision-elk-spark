# AgroVision - pipeline Logstash V2 (fiabilise).
# input  : fichier CSV en mode read, sincedb persistant (reprise)
# filter : copie de la ligne brute, parsing CSV (15 colonnes), validation Ruby (agro_validate_v2.rb),
#          prune par liste blanche selon le statut valid / rejected
# output : valides -> VALID_INDEX (_id = observation_id, idempotent) ;
#          rejets  -> REJECT_INDEX (_id = SHA1 fichier+ligne+categorie+occurrence)
# Parametres par variables d'environnement (DATA_GLOB, SINCEDB, VALID_INDEX, REJECT_INDEX, RUN_ID...)
# Lancement : via run_ingest.py (genere logstash.yml : workers, lot, file persistante, DLQ)
input {
  file {
    path => "${DATA_GLOB:/home/vm4/tp3_elk/data/agro_load*.csv}"
    mode => "read"
    start_position => "beginning"
    sincedb_path => "${SINCEDB:/home/vm4/tp3_elk/state/sincedb_manual}"
    sincedb_write_interval => 2
    file_completed_action => "log"
    file_completed_log_path => "${COMPLETED_LOG:/home/vm4/tp3_elk/state/completed_manual.log}"
  }
}

filter {
  mutate { copy => { "message" => "raw_line" } }
  csv {
    source => "message"
    separator => ","
    skip_header => true
    columns => ["observation_id","field_id","region","crop_type","observation_date","ndvi","soil_moisture",
                "temperature","rainfall_mm","irrigation_liters","sensor_id","sensor_status","area_ha",
                "alert_flag","notes"]
  }
  ruby {
    path => "${LS_DIR:/home/vm4/tp3_elk/logstash}/agro_validate_v2.rb"
    script_params => { "run_id" => "${RUN_ID:manual}" }
  }
  if [@metadata][status] == "valid" {
    prune { whitelist_names => ["^observation_id$","^field_id$","^region$","^crop_type$","^observation_date$",
      "^ndvi$","^soil_moisture$","^temperature$","^rainfall_mm$","^irrigation_liters$","^sensor_id$",
      "^sensor_status$","^area_ha$","^alert_flag$","^notes$","^run_id$","^source_file$","^@timestamp$"] }
  } else {
    prune { whitelist_names => ["^observation_id$","^anomaly_category$","^anomaly_detail$","^error_class$",
      "^raw_line$","^run_id$","^source_file$","^@timestamp$"] }
  }
}

output {
  if [@metadata][status] == "valid" {
    elasticsearch {
      hosts => ["http://node-1:9200","http://node-2:9200","http://node-3:9200"]
      index => "${VALID_INDEX:agro-load-v1}"
      document_id => "%{observation_id}"
      action => "index"
      manage_template => false
      ilm_enabled => false
    }
  } else {
    elasticsearch {
      hosts => ["http://node-1:9200","http://node-2:9200","http://node-3:9200"]
      index => "${REJECT_INDEX:agro-load-rejected-v1}"
      document_id => "%{[@metadata][reject_id]}"
      action => "index"
      manage_template => false
      ilm_enabled => false
    }
  }
}
